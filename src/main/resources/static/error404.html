<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Fruit Server</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: 2rem;
    }

    .error-code {
      font-size: 8rem;
      font-weight: bold;
      color: #ff6b6b;
      text-shadow: 3px 3px 0px #ff9999;
      margin-bottom: 1rem;
      animation: bounce 2s infinite;
    }

    .main-message {
      font-size: 2.5rem;
      color: #ff6b6b;
      margin-bottom: 1rem;
      font-weight: bold;
    }

    .pun-message {
      font-size: 1.5rem;
      color: #666;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .additional-puns h3 {
      color: #856404;
      margin-bottom: 1rem;
      font-size: 1.3rem;
    }

    .pun-list li {
      margin: 0.5rem 0;
      font-size: 1.1rem;
    }

    .pun-list li:before {
      content: "🍎 ";
      margin-right: 0.5rem;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }

    @keyframes wiggle {
      0% {
        transform: rotate(-5deg);
      }
      100% {
        transform: rotate(5deg);
      }
    }

    @media (max-width: 768px) {
      .error-code {
        font-size: 5rem;
      }
      .main-message {
        font-size: 2rem;
      }
      .pun-message {
        font-size: 1.2rem;
      }
      .container {
        padding: 2rem;
        margin: 1rem;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="error-code">4🍊4</div>

  <h1 class="main-message">Oops! This page is bananas!</h1>

  <p class="pun-message">
    "Life gives you lemons, we give you 404 errors with style!" 🍋✨
  </p>
</div>
</body>
</html>
